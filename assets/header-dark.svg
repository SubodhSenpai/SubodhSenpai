<g class="a" style="animation-delay:4.65s"><text x="586.8" y="188" textLength="16.2" lengthAdjust="spacing" class="ok">ok</text></g>
<g class="a" style="animation-delay:4.79s"><text x="52.2" y="208" textLength="48.6" lengthAdjust="spacing" class="dim">step 3</text><text x="117.0" y="208" textLength="32.4" lengthAdjust="spacing" class="fn">work</text><text x="149.4" y="208" textLength="8.1" lengthAdjust="spacing" class="fg">(</text><text x="157.5" y="208" textLength="137.7" lengthAdjust="spacing" class="str">"clarice systems"</text><text x="295.2" y="208" textLength="8.1" lengthAdjust="spacing" class="fg">,</text><text x="311.4" y="208" textLength="56.7" lengthAdjust="spacing" class="arg">client=</text><text x="368.1" y="208" textLength="48.6" lengthAdjust="spacing" class="str">"drdo"</text><text x="416.7" y="208" textLength="8.1" lengthAdjust="spacing" class="fg">)</text><text x="513.9" y="208" textLength="56.7" lengthAdjust="spacing" class="dim">2024-26</text></g>
<g class="a" style="animation-delay:4.99s"><text x="586.8" y="208" textLength="16.2" lengthAdjust="spacing" class="ok">ok</text></g>
<g class="a" style="animation-delay:5.13s"><text x="52.2" y="228" textLength="48.6" lengthAdjust="spacing" class="dim">step 4</text><text x="117.0" y="228" textLength="32.4" lengthAdjust="spacing" class="fn">ship</text><text x="149.4" y="228" textLength="8.1" lengthAdjust="spacing" class="fg">(</text><text x="157.5" y="228" textLength="89.1" lengthAdjust="spacing" class="str">"regshield"</text><text x="246.6" y="228" textLength="8.1" lengthAdjust="spacing" class="fg">,</text><text x="262.8" y="228" textLength="121.5" lengthAdjust="spacing" class="str">"researchagent"</text><text x="384.3" y="228" textLength="8.1" lengthAdjust="spacing" class="fg">,</text><text x="400.5" y="228" textLength="81.0" lengthAdjust="spacing" class="str">"datalens"</text><text x="481.5" y="228" textLength="8.1" lengthAdjust="spacing" class="fg">)</text><text x="513.9" y="228" textLength="32.4" lengthAdjust="spacing" class="dim">2026</text></g>
<g class="a" style="animation-delay:5.33s"><text x="586.8" y="228" textLength="16.2" lengthAdjust="spacing" class="ok">ok</text></g>
<g class="a" style="animation-delay:5.47s"><text x="52.2" y="248" textLength="48.6" lengthAdjust="spacing" class="dim">step 5</text><text x="117.0" y="248" textLength="40.5" lengthAdjust="spacing" class="fn">learn</text><text x="157.5" y="248" textLength="8.1" lengthAdjust="spacing" class="fg">(</text><text x="165.6" y="248" textLength="121.5" lengthAdjust="spacing" class="str">"llm inference"</text><text x="287.1" y="248" textLength="8.1" lengthAdjust="spacing" class="fg">)</text><text x="513.9" y="248" textLength="24.3" lengthAdjust="spacing" class="dim">now</text></g>
<g class="a" style="animation-delay:5.67s"><text x="586.8" y="248" textLength="56.7" lengthAdjust="spacing" class="warn pulse">running</text></g>
<g class="a" style="animation-delay:5.92s"><text x="36.0" y="288" textLength="48.6" lengthAdjust="spacing" class="ok b">PASSED</text><text x="100.8" y="288" textLength="48.6" lengthAdjust="spacing" class="fg">career</text><text x="165.6" y="288" textLength="97.2" lengthAdjust="spacing" class="fg">subodh singh</text><text x="279.0" y="288" textLength="129.6" lengthAdjust="spacing" class="fg">(composite 0.98)</text></g>
<g class="a" style="animation-delay:6.02s"><text x="52.2" y="308" textLength="113.4" lengthAdjust="spacing" class="fg">tool_selection</text><text x="246.6" y="308" textLength="32.4" lengthAdjust="spacing" class="ok">1.00</text><text x="295.2" y="308" textLength="267.3" lengthAdjust="spacing" class="dim">python, langgraph, fastapi, react</text></g>
<g class="a" style="animation-delay:6.12s"><text x="52.2" y="328" textLength="105.3" lengthAdjust="spacing" class="fg">call_ordering</text><text x="246.6" y="328" textLength="32.4" lengthAdjust="spacing" class="ok">1.00</text><text x="295.2" y="328" textLength="307.8" lengthAdjust="spacing" class="dim">internship, degree, job. in that order</text></g>
<g class="a" style="animation-delay:6.22s"><text x="52.2" y="348" textLength="121.5" lengthAdjust="spacing" class="fg">step_efficiency</text><text x="246.6" y="348" textLength="32.4" lengthAdjust="spacing" class="ok">0.90</text><text x="295.2" y="348" textLength="315.9" lengthAdjust="spacing" class="dim">took a 12 s query to under 3 s. next: 1</text></g>
