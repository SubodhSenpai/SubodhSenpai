<svg xmlns="http://www.w3.org/2000/svg" width="776" height="448" viewBox="0 0 776 448" role="img" aria-label="Terminal replaying Subodh Singh's career as an agent trace">
<style>
text{font-family:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:13.5px;white-space:pre}
.fg{fill:#ecdfd0}.dim{fill:#86776a}.prompt{fill:#f2a65e}.fn{fill:#f2a65e}
.str{fill:#e8c291}.arg{fill:#c7a489}.ok{fill:#a9d38b}.warn{fill:#f2a65e}.b{font-weight:700}
.a{opacity:0;animation:show .01s linear forwards}
.cur{animation:hide .01s linear forwards}
.blink{animation:blink 1.1s step-end infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes show{to{opacity:1}}
@keyframes hide{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes ty1{to{transform:translateX(48.6px)}}
@keyframes ty2{to{transform:translateX(234.9px)}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}.cover,.cur{display:none}
.blink,.pulse{animation:none}}
</style>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter></defs>
<rect filter="url(#sh)" x="8" y="4" width="760" height="426" rx="11" fill="#1a1512" stroke="#3a2e27"/>
<path d="M8.5,38 V15.0 a10.5,10.5 0 0 1 10.5,-10.5 H757.0 a10.5,10.5 0 0 1 10.5,10.5 V38 Z" fill="#211a16"/>
<line x1="8" y1="38" x2="768" y2="38" stroke="#3a2e27"/>
<circle cx="28" cy="21.0" r="5.5" fill="#3f322b"/>
<circle cx="45" cy="21.0" r="5.5" fill="#3f322b"/>
<circle cx="62" cy="21.0" r="5.5" fill="#3f322b"/>
<text x="388.0" y="25.0" text-anchor="middle" style="font-size:12px;fill:#7d6e62">subodh@senpai: ~</text>
<g class="a" style="animation-delay:0.50s"><text x="36.0" y="68" textLength="8.1" lengthAdjust="spacing" class="prompt">~</text><text x="52.2" y="68" textLength="8.1" lengthAdjust="spacing" class="prompt">$</text><text x="68.4" y="68" textLength="48.6" lengthAdjust="spacing" class="fg">whoami</text><g style="animation:ty1 0.36s steps(6,end) 0.80s forwards"><rect class="cover" x="67.4" y="54.5" width="60.7" height="20" fill="#1a1512"/><rect class="cur" style="animation-delay:1.36s" x="68.4" y="56.9" width="8.1" height="14.6" fill="#f2a65e"/></g></g>
<g class="a" style="animation-delay:1.48s"><text x="36.0" y="88" textLength="97.2" lengthAdjust="spacing" class="fg b">subodh singh</text><text x="141.3" y="88" textLength="170.1" lengthAdjust="spacing" class="fg">· ai engineer · india</text></g>
<g class="a" style="animation-delay:1.60s"><text x="36.0" y="108" textLength="526.5" lengthAdjust="spacing" class="dim">i build ai agents, and the tools that check what they actually do</text></g>
<g class="a" style="animation-delay:2.05s"><text x="36.0" y="148" textLength="8.1" lengthAdjust="spacing" class="prompt">~</text><text x="52.2" y="148" textLength="8.1" lengthAdjust="spacing" class="prompt">$</text><text x="68.4" y="148" textLength="234.9" lengthAdjust="spacing" class="fg">regshield replay career.trace</text><g style="animation:ty2 1.22s steps(29,end) 2.35s forwards"><rect class="cover" x="67.4" y="134.5" width="247.0" height="20" fill="#1a1512"/><rect class="cur" style="animation-delay:3.77s" x="68.4" y="136.9" width="8.1" height="14.6" fill="#f2a65e"/></g></g>
<g class="a" style="animation-delay:4.11s"><text x="52.2" y="168" textLength="48.6" lengthAdjust="spacing" class="dim">step 1</text><text x="117.0" y="168" textLength="48.6" lengthAdjust="spacing" class="fn">intern</text><text x="165.6" y="168" textLength="8.1" lengthAdjust="spacing" class="fg">(</text><text x="173.7" y="168" textLength="97.2" lengthAdjust="spacing" class="str">"ati motors"</text><text x="270.9" y="168" textLength="8.1" lengthAdjust="spacing" class="fg">,</text><text x="287.1" y="168" textLength="40.5" lengthAdjust="spacing" class="arg">role=</text><text x="327.6" y="168" textLength="121.5" lengthAdjust="spacing" class="str">"data engineer"</text><text x="449.1" y="168" textLength="8.1" lengthAdjust="spacing" class="fg">)</text><text x="513.9" y="168" textLength="56.7" lengthAdjust="spacing" class="dim">2024.01</text></g>
<g class="a" style="animation-delay:4.31s"><text x="586.8" y="168" textLength="16.2" lengthAdjust="spacing" class="ok">ok</text></g>
